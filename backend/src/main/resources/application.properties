spring.application.name=backend

## PERSISTENCE
spring.datasource.url=jdbc:mysql://localhost:3306/hijob
spring.datasource.username=root
spring.datasource.password=lvxteamadoniss1
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
logging.level.org.hibernate=ERROR

# springdocs.api
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method

spring.mail.host=
spring.mail.port=
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# config web cors
app.cors.allowedOrigins=*

# file upload
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
#liquid-base
spring.liquibase.change-log=classpath:/db.changelog/app-changelog.xml
spring.liquibase.default-schema=Hijob

spring.data.elasticsearch.cluster-node=localhost:9200
spring.elasticsearch.rest.uris=http://localhost:9200
spring.data.elasticsearch.repositories.enabled=true

spring.main.allow-bean-definition-overriding=true
